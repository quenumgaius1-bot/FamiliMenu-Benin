name: Build FamiliMenu APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup pnpm
    run: |
      corepack enable
      corepack prepare pnpm@10.8.1 --activate

  - name: Install dependencies
    run: pnpm install --no-frozen-lockfile

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Generate Android project
    working-directory: artifacts/famili-menu
    run: pnpm exec expo prebuild --platform android --no-install

  - name: Build APK
    working-directory: artifacts/famili-menu/android
    run: chmod +x gradlew && ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FamiliMenu-APK
      path: artifacts/famili-menu/android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
