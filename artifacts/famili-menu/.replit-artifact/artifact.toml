kind = "mobile"
previewPath = "/"
title = "FamiliMenu"
description = "Une application mobile en français pour aider les familles béninoises à planifier leurs repas, découvrir des recettes locales, recevoir des rappels et gérer leur formule d’abonnement."
version = "1.0.0"
id = "artifacts/famili-menu"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24055

[services.development]
run = "pnpm --filter @workspace/famili-menu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/famili-menu", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/famili-menu", "run", "serve" ]

[services.env]
PORT = "24055"
BASE_PATH = "/"
